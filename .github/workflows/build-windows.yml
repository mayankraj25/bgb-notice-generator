name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openpyxl python-docx python-dateutil pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller app_gui.py `
            --onefile `
            --windowed `
            --name "BGB_Notice_Generator" `
            --collect-all openpyxl `
            --collect-all docx `
            --collect-all dateutil `
            --hidden-import excel_parser `
            --hidden-import letter_generator `
            --hidden-import amount_to_words `
            --hidden-import utils `
            --add-data "excel_parser.py;." `
            --add-data "letter_generator.py;." `
            --add-data "amount_to_words.py;." `
            --add-data "utils.py;."

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BGB-Notice-Generator-Windows
          path: dist/BGB_Notice_Generator.exe
          retention-days: 30
